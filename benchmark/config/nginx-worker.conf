# FrankenPHP worker stack (evo-worker): nginx serves the static files and
# resolves the upstream per request, as on every stack, and hands PHP to
# FrankenPHP over HTTP where the FPM stacks use FastCGI.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php php-worker:80;
    root /var/www/html;
    index index.php;
    gzip off;
    location / { try_files $uri $uri/ @front; }
    # A worker serves one origin (EVO_WORKER_ORIGIN) and answers any other
    # with 421, while the harness reaches the stack as 127.0.0.1:PORT and as
    # nginx-worker: front-end requests carry that origin's host. The pages
    # link relatively, so the host appears nowhere in what is measured.
    location @front {
        proxy_pass http://$php;
        proxy_set_header Host evo-worker;
    }
    location = /index.php {
        proxy_pass http://$php;
        proxy_set_header Host evo-worker;
    }
    # The manager runs as classic PHP and keeps the client's host, as it
    # does behind FastCGI.
    location ~ \.php$ {
        proxy_pass http://$php;
        proxy_set_header Host $http_host;
    }
}
