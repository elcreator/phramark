# The upstream is resolved through Docker DNS at request time (cached 5 s)
# so a recreated PHP-FPM container, e.g. for a JIT switch, is picked up
# without restarting nginx. Identical on every stack.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $fpm php-drupal-11:9000;
    root /var/www/html/web;
    index index.php;
    gzip off;
    location / { try_files $uri $uri/ @drupal; }
    location @drupal { rewrite ^/(.*)$ /index.php?q=/$1 last; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_SELF /index.php;
        fastcgi_pass $fpm;
    }
}
