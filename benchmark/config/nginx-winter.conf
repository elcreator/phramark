# The upstream is resolved through Docker DNS at request time (cached 5 s)
# so a recreated PHP-FPM container, e.g. for a JIT switch, is picked up
# without restarting nginx. Identical on every stack.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $fpm php-winter:9000;
    root /var/www/html;
    index index.php;
    gzip off;
    # Winter serves everything through index.php; its own .htaccess protects
    # these trees under Apache, so nginx does the same.
    location ~ ^/(modules|plugins|themes)/.*\.php$ { return 404; }
    location ~ ^/(bootstrap|config|storage|vendor)/ { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_SELF /index.php;
        fastcgi_pass $fpm;
    }
}
