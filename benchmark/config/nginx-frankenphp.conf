server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php php-frankenphp:80;
    root /var/www/html;
    index index.php;
    gzip off;
    location / { try_files $uri $uri/ @front; }
    location @front {
        proxy_pass http://$php;
        proxy_set_header Host $http_host;
    }
    location ~ \.php$ {
        proxy_pass http://$php;
        proxy_set_header Host $http_host;
    }
}
