# The upstream is resolved through Docker DNS at request time (cached 5 s)
# so a recreated PHP-FPM container, e.g. for a JIT switch, is picked up
# without restarting nginx. Identical on every stack.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $fpm php-modx:9000;
    root /var/www/html;
    index index.php;
    gzip off;
    # The manager login redirects to /manager (no slash); the directory
    # redirect nginx answers must keep the published port the browser used.
    absolute_redirect off;
    # The core is never web-reachable (its .htaccess denies it under Apache);
    # the manager and connectors are separate entry points.
    location ~ ^/core/ { return 404; }
    location / { try_files $uri $uri/ @modx; }
    # MODX friendly URLs: ht.access rewrites every missing path to
    # index.php?q=PATH, which modRequest resolves through the alias map.
    location @modx { rewrite ^/(.*)$ /index.php?q=$1 last; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass $fpm;
    }
}
