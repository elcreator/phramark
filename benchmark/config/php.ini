opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
; Drupal 11 and TYPO3 ship well over the default 10,000 accelerated files and
; 128 MiB of opcodes; identical headroom for every stack keeps OPcache restarts
; out of the comparison.
opcache.memory_consumption=512
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=100000
realpath_cache_size=4M
realpath_cache_ttl=600
zend.assertions=-1
display_errors=0
log_errors=1
; PHP-side memory probe: one JSON line per request in /var/log/phramark/memory.log
; (see benchmark/fixtures/memory-prepend.php). Same cost on every stack.
auto_prepend_file=/opt/phramark/benchmark/fixtures/memory-prepend.php
