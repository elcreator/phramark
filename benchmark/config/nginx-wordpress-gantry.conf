# The upstream is resolved through Docker DNS at request time (cached 5 s)
# so a recreated PHP-FPM container, e.g. for a JIT switch, is picked up
# without restarting nginx. Identical on every stack.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $fpm php-wordpress-gantry:9000;
    root /var/www/html;
    index index.php;
    gzip off;
    # /wp-admin redirects to /wp-admin/; the directory redirect nginx answers
    # must keep the published port the browser used.
    absolute_redirect off;
    # WordPress front controller: every missing path is index.php, which
    # resolves /articles/category-NNN through the page hierarchy.
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass $fpm;
    }
}
