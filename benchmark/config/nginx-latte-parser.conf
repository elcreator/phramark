# The upstream is resolved through Docker DNS at request time (cached 5 s)
# so a recreated PHP-FPM container, e.g. for a JIT switch, is picked up
# without restarting nginx. Identical on every stack.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $fpm php-latte-parser:9000;
    root /var/www/html;
    index index.php;
    gzip off;
    location / { try_files $uri $uri/ /index.php?q=$uri&$args; }
    # What Evolution's manager/.htaccess does on Apache (and ng.inx on nginx): a
    # path under /manager/ that is not a file goes to the manager's front
    # controller, as on nginx-sarticles.conf. evo-ui serves its JavaScript and
    # Livewire updates from such routes (/manager/evo-ui?action=update); without
    # this the root index.php answers them with the site's 404. A missing asset
    # stays a 404: handing one to the front controller makes the manager answer 500.
    location ~ ^/manager/.+\.(js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }
    location /manager/ { try_files $uri $uri/ /manager/index.php?$args; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass $fpm;
    }
}
